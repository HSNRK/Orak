<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orak</title>
<link rel="icon" href="orak-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="orak-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#F6F4EE;
    --card:#FFFFFF;
    --ink:#26251F;
    --dim:#8A8677;
    --line:#E7E3D8;
    --shadow:0 8px 24px rgba(38,37,31,.06);

    --blue:#4285F4;
    --red:#EA4335;
    --yellow:#FBBC05;
    --green:#34A853;
    --black:#111111;
    --white-stripe:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:28px;
  }
  .wrap{ width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; }

  /* wordmark: each letter = full stripe set of google colors */
  h1.logo{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:56px;
    margin:0 0 30px;
    letter-spacing:.01em;
    display:flex;
  }
  h1.logo span{
    background-image: repeating-linear-gradient(
      to bottom,
      var(--blue) 0%, var(--blue) 16.66%,
      var(--red) 16.66%, var(--red) 33.33%,
      var(--yellow) 33.33%, var(--yellow) 50%,
      var(--green) 50%, var(--green) 66.66%,
      var(--black) 66.66%, var(--black) 83.33%,
      var(--white-stripe) 83.33%, var(--white-stripe) 100%
    );
    background-size: 100% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1px #d8d4c6;
  }

  form{
    width:100%;
    display:flex;
    align-items:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:var(--shadow);
    padding:6px 6px 6px 24px;
  }
  form:focus-within{ border-color:#d7d2c2; }

  input[type=text]{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:17px;
    padding:14px 8px;
  }
  input[type=text]::placeholder{ color:#B7B2A2; }

  button.go{
    flex-shrink:0;
    width:46px;
    height:46px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  button.go:active{ transform:scale(.94); }

  .hint{
    color:var(--dim);
    font-size:12px;
    margin-top:12px;
    text-align:center;
  }
  .hint b{ color:var(--ink); font-weight:600; }

  .engines{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-top:30px;
  }
  .engine{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    color:var(--dim);
    cursor:pointer;
    transition:transform .12s ease, color .12s ease, border-color .12s ease;
  }
  .engine:active{ transform:scale(.92); }
  .engine[data-bang="g"]:hover{ color:var(--blue); border-color:var(--blue); }
  .engine[data-bang="yt"]:hover{ color:#FF0000; border-color:#FF0000; }
  .engine[data-bang="gh"]:hover{ color:#181717; border-color:#181717; }
  .engine[data-bang="wiki"]:hover{ color:#000; border-color:#999; }
  .engine[data-bang="maps"]:hover{ color:var(--green); border-color:var(--green); }
  .engine[data-bang="img"]:hover{ color:var(--yellow); border-color:var(--yellow); }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="logo"><span>O</span><span>r</span><span>a</span><span>k</span></h1>

    <form id="searchForm" autocomplete="off">
      <input id="q" type="text" placeholder="ara..." autofocus>
      <button class="go" type="submit" aria-label="Ara"><i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <div class="hint">reklamsız arama — düz yaz ya da <b>g:</b> <b>yt:</b> <b>gh:</b> <b>wiki:</b> ile direkt git</div>

    <div class="engines">
      <button type="button" class="engine" data-bang="g" title="Google"><i class="fa-brands fa-google"></i></button>
      <button type="button" class="engine" data-bang="yt" title="YouTube"><i class="fa-brands fa-youtube"></i></button>
      <button type="button" class="engine" data-bang="gh" title="GitHub"><i class="fa-brands fa-github"></i></button>
      <button type="button" class="engine" data-bang="wiki" title="Vikipedi"><i class="fa-brands fa-wikipedia-w"></i></button>
      <button type="button" class="engine" data-bang="maps" title="Harita"><i class="fa-solid fa-location-dot"></i></button>
      <button type="button" class="engine" data-bang="img" title="Görsel"><i class="fa-regular fa-image"></i></button>
    </div>
  </div>

<script>
  const BANGS = {
    g:    q => `https://www.google.com/search?q=${q}`,
    yt:   q => `https://www.youtube.com/results?search_query=${q}`,
    gh:   q => `https://github.com/search?q=${q}`,
    wiki: q => `https://tr.wikipedia.org/w/index.php?search=${q}`,
    maps: q => `https://www.google.com/maps/search/${q}`,
    img:  q => `https://duckduckgo.com/?iax=images&ia=images&q=${q}`,
  };
  const DEFAULT = q => `https://lite.duckduckgo.com/lite/?q=${q}`;

  const form  = document.getElementById('searchForm');
  const input = document.getElementById('q');

  function parse(raw){
    const m = raw.trim().match(/^([a-z]+):\s*(.*)$/i);
    if (m && BANGS[m[1].toLowerCase()]) return { bang: m[1].toLowerCase(), term: m[2] };
    return { bang: null, term: raw.trim() };
  }

  document.querySelectorAll('.engine').forEach(btn=>{
    btn.addEventListener('click', () => {
      input.value = btn.dataset.bang + ': ';
      input.focus();
    });
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const raw = input.value.trim();
    if (!raw) return;
    const { bang, term } = parse(raw);
    if (!term && bang) return;
    const q = encodeURIComponent(term || raw);
    window.location.href = bang ? BANGS[bang](q) : DEFAULT(q);
  });
</script>
</body>
</html>
